<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>班级成绩表</title>
    <style>
        table {
            width: 100vw;       /* CSS 用冒号，不是等号 */
            height: auto;       /* 表格高度用 auto 更合理，100vw 会变形 */
            text-align: center; /* CSS 正确写法 */
            border: 1px solid #ccc;
            border-collapse: collapse; /* 合并边框，必须加分号 */
        }
        td, th {
            border: 1px solid #ccc; /* 合并为一行，规范写法 */
            padding: 8px; /* 加内边距，表格更好看 */
        }
        .odd {
            background-color: #fff;
        }
        .even {
            background-color: #c0c0c0;
        }
        tfoot td {
            font-weight: bold;
        }
    </style>
</head>
<body>
<table>
    <caption>班级成绩表</caption>
    <thead>
    <tr>
        <th>学号</th>
        <th>姓名</th>
        <th>语文</th>
        <th>数学</th>
        <th>英语</th>
        <th>总分</th>
    </tr>
    </thead>
    <tbody>
    <tr class="odd">
        <td>1</td>
        <td>马英杰</td>
        <td>100</td>
        <td>90</td>
        <td>120</td>
        <td>310</td>
    </tr>
    <tr class="even">
        <td>2</td>
        <td>刘博文</td>
        <td>90</td>
        <td>105</td>
        <td>85</td>
        <td>280</td>
    </tr> <!-- 这里原来漏写了闭合标签 -->
    <tr class="odd">
        <td>3</td>
        <td>陈铁枫</td>
        <td>105</td>
        <td>125</td>
        <td>110</td>
        <td>330</td>
    </tr>
    </tbody>
    <tfoot>
    <tr>
        <td colspan="6">陈铁枫最牛逼</td>
    </tr>
    </tfoot>
</table>
</body>
</html>
